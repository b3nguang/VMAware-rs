[package]
name = "vmaware"
version = "0.1.0"
edition = "2026"
description = "A cross-platform Rust library for virtual machine detection."
license = "MIT"
repository = "https://github.com/b3nguang/VMAware-rs"
keywords = ["vm", "detection", "hypervisor", "virtual-machine", "security"]
categories = ["os", "hardware-support"]

[lib]
name = "vmaware"
path = "src/lib.rs"

[[bin]]
name = "vmaware-cli"
path = "src/bin/cli.rs"

[dependencies]
once_cell = "1.19"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
raw-cpuid = "11"

[target.'cfg(target_arch = "x86")'.dependencies]
raw-cpuid = "11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_System_Ioctl",
    "Win32_NetworkManagement_IpHelper",
] }
winreg = "0.52"

[features]
default = []
json = ["serde", "serde_json"]
